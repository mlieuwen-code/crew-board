<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew Job Board</title>
<meta name="theme-color" content="#123A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crew Board">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="ra-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="ra-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@700;800&family=Lexend:wght@400;500;600;700;800;900&display=swap">
<style id="app-style">
:root{
  --bg:#EDF1F5;--card:#FFFFFF;--ink:#0F1E29;--muted:#5A6B79;--line:#D5DEE7;--field:#F5F8FB;
  --chip:#E4EBF2;--chip2:#DBE4ED;--amberbg:#FBEBD0;--amberink:#6B4210;--bad:#A12D22;--badbg:#FBE9E6;
  --accent:#16445F;--tint:#EAF2F8;--tint2:#DDEAF3;--deep:#0E2A3B;--orange:#2289BB;--navy:#0E2A3B;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 var(--font);-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--deep)}
.wrap{max-width:1500px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:240px}
#logo{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
#logo svg,#logo img{pointer-events:none}
.logo{height:40px;flex-shrink:0;display:flex;align-items:center}.logo img{height:40px;width:auto;display:block}
.brand b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--chip);color:var(--ink);font-size:17px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.org{background:var(--orange);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{min-height:40px;padding:0 13px;font-size:15px;border-radius:11px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.tab{flex:0 0 auto;min-height:52px;padding:0 20px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:700}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.nav{display:flex;align-items:center;gap:10px;margin:14px 0 16px;flex-wrap:wrap}
.nav h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:700;line-height:1.1;flex:1;min-width:220px}
.nav h1 small{display:block;font-size:17px;color:var(--muted);font-weight:600}
.round{width:52px;height:52px;border-radius:26px;border:0;background:var(--chip2);font-size:22px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}.round svg{display:block}
.editbar{background:var(--amberbg);color:var(--amberink);border-radius:16px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.editbar span{flex:1;min-width:200px}
.daynote{background:var(--tint2);color:var(--deep);border-radius:18px;padding:14px 18px;font-weight:600;margin-bottom:14px;white-space:pre-wrap;border-left:8px solid var(--accent)}
.empty{background:var(--card);border-radius:22px;padding:28px;text-align:center;color:var(--muted);font-weight:500}
/* site cards */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
@media(max-width:700px){.sites{grid-template-columns:1fr}}
.site{background:var(--card);border-radius:22px;box-shadow:0 2px 0 var(--line);overflow:hidden;border-top:10px solid var(--tc,#888)}
.shead{padding:16px 18px 10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shead .fold{flex:none;align-self:center;width:44px;height:44px;border-radius:12px;border:0;padding:0;background:var(--chip,#E4EBF2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.shead .fold svg{display:block;transition:transform .15s}
.site.folded .shead .fold svg{transform:rotate(-90deg)}
.site.folded>:not(.shead){display:none}
.site.folded .shead{padding-bottom:16px}
.site.folded .fsum{display:block}.site.folded .caltitle{display:none}
.fsum{display:none;margin-top:6px;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .t{flex:1;min-width:0}
.shead h2{margin:0;font-size:28px;font-weight:700;line-height:1.1}
.num{flex-shrink:0;width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.type{display:inline-block;border-radius:9px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:var(--tc,#888);text-transform:uppercase;letter-spacing:.4px;margin-right:6px;vertical-align:2px}
.meta{font-size:16px;color:var(--muted);font-weight:600;margin-top:4px}
.crew{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.cchip{background:var(--tint2);color:var(--deep);border-radius:999px;padding:4px 12px;font-size:16px;font-weight:700}
.cchip.lead{background:var(--accent);color:#fff}
.addr{margin:0 18px 12px;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center}
.addr .a{flex:1;min-width:0}
.addr small{display:block;color:var(--muted);font-weight:500;font-size:15px}
.tel{color:var(--deep);font-weight:700;text-decoration:underline;white-space:nowrap}
.map{flex-shrink:0;background:var(--accent);color:#fff;text-decoration:none;border-radius:11px;padding:8px 12px;font-size:15px;font-weight:700}
.sec{margin:0 18px 12px;border-radius:14px;padding:10px 14px}
.sec h3{margin:0 0 4px;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sec ul{margin:0;padding:0;list-style:none}
.sec li{padding:5px 0 5px 30px;position:relative;font-weight:500;font-size:19px;border-top:1px dashed rgba(0,0,0,.08)}
.sec li:first-child{border-top:0}
.sec li:before{position:absolute;left:2px;top:6px;font-weight:700}
.s-do{background:var(--tint)}.s-do h3{color:var(--deep)}.s-do li:before{content:"☐";color:var(--accent)}
.s-ms{background:#FDECEA}.s-ms h3{color:#B3261E}.s-ms li:before{content:"📏";font-size:16px}
.s-lo{background:#FFE8A3;border:3px solid #E0A800}.s-lo h3{color:#7A4A00}.s-lo li:before{content:"⛔";font-size:16px}
.s-br{background:var(--chip)}.s-br h3{color:var(--muted)}.s-br li:before{content:"•";color:var(--muted)}
.s-nted{white-space:normal}
.inote{display:block;width:100%;min-height:96px;resize:vertical;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font:500 18px/1.4 var(--font);color:var(--ink)}
.inote:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.noterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}.noterow .inote-st{flex:1;margin:0}
.inote-st{min-height:18px;margin-top:4px;font-size:14px;font-weight:600;color:var(--muted)}
.s-nt{background:var(--field);border:2px dashed var(--line);white-space:pre-wrap;font-weight:500}.s-nt h3{color:var(--muted)}
.sfoot{display:flex;gap:8px;flex-wrap:wrap;padding:4px 18px 16px}
/* week */
.week{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px}
@media(max-width:1000px){.week{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
@media(max-width:560px){.week{grid-template-columns:1fr}.wday{min-height:0}}
.caltitle{margin-top:6px;font-size:18px;font-weight:700;color:var(--ink)}
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}
.calbar span{color:var(--muted);font-weight:500;font-size:15px}
.wday{background:var(--chip2);border-radius:20px;padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px}
.wday.today{outline:4px solid var(--orange)}
.whead{border:0;background:none;text-align:left;padding:4px 6px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.whead small{color:var(--muted);font-weight:600;font-size:15px}
.wh{display:flex;align-items:center;gap:6px}.wh .whead{flex:1;min-width:0}
.wfold{flex:none;display:flex;align-items:center;gap:6px;border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:0 10px;height:40px;font-weight:600;font-size:14px}
.wfold svg{display:block;transition:transform .15s}.wfolded .wfold svg{transform:rotate(-90deg)}
.wfold .wcount{display:none;color:var(--muted)}.wfolded .wfold .wcount{display:inline}
.wday.wfolded{min-height:0}.wday.wfolded>:not(.wh){display:none}
.wcard{border:0;text-align:left;background:var(--card);border-radius:14px;padding:10px 12px;border-left:8px solid var(--tc,#888);box-shadow:0 2px 0 var(--line)}
.wcard b{display:block;font-size:19px;font-weight:700}
.wcard span{display:block;font-size:14px;color:var(--muted);font-weight:600}
.wcard .lo{color:#7A4A00}
.wempty{color:var(--muted);font-weight:500;font-size:15px;padding:6px}
.weeknote{margin-bottom:14px}
/* directory */
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.dcard{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 2px 0 var(--line)}
.dcard b{font-size:22px;font-weight:700}
.bld{display:inline-block;vertical-align:4px;font-size:14px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:8px;padding:2px 9px;letter-spacing:.2px}
.dcard p{margin:4px 0;font-weight:500;color:var(--muted);white-space:pre-wrap}
.dcard .miss{color:var(--bad)}
.search{width:100%;min-height:56px;font-size:19px;font-weight:500;border-radius:16px;border:2px solid var(--line);background:var(--field);padding:0 16px;margin-bottom:14px}
/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(14,42,59,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
.box2{background:var(--card);border-radius:24px;padding:22px;max-width:760px;width:100%;display:flex;flex-direction:column;gap:12px}
.box2 h2{margin:0;font-size:26px;font-weight:700}
.box2 label{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.box2 label i{font-style:normal;text-transform:none;font-weight:500;letter-spacing:0}
.box2 input,.box2 textarea,.box2 select{width:100%;border-radius:14px;border:2px solid var(--line);background:var(--field);padding:10px 14px;font-size:18px;font-weight:500}
.box2 textarea{min-height:92px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pick.lead{background:var(--deep);border-color:var(--orange);color:#fff}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.mrow .sp{flex:1}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#0E2A3B;color:#fff;font-size:18px;font-weight:600;padding:14px 24px;border-radius:999px;transition:opacity .35s}
.toast.out{opacity:0}
.ro{color:var(--muted);font-size:14px;font-weight:500;text-align:center;margin-top:28px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;font-weight:600;color:var(--muted);margin:16px 2px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

.awaybar{background:#ECEAE6;border-left:8px solid #616161;border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.wav{color:#4a4a4a!important;font-weight:700!important;background:#ECEAE6;border-radius:10px;padding:4px 8px!important}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;font-size:13px;margin-left:4px;padding:0 6px}
.offform{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:12px;max-width:760px}
.offform h2{margin:0;font-size:22px;font-weight:700}
.offform label{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.offform label i{font-style:normal;text-transform:none;font-weight:500;letter-spacing:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.row2>div{min-width:0}
.offform input,.offform select{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--field);padding:8px 14px;font-size:18px;font-weight:500}
.offsent{background:var(--done);color:var(--doneink);border-radius:16px;padding:14px 16px;font-weight:700;margin-top:12px;max-width:760px}
.offh{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:22px 2px 8px}
.offrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 0 var(--line);border-left:8px solid #999;max-width:760px}
.offrow .o-main{flex:1;min-width:180px}.offrow b{display:block;font-size:20px;font-weight:700}.offrow span{font-weight:600;color:var(--muted)}.offrow em{display:block;font-style:normal;font-weight:500;margin-top:2px}
.ochip{border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:#fff!important;background:#999}
.st-pending{border-left-color:#E0A800}.st-pending .ochip{background:#B07F00}
.st-approved{border-left-color:#2E8C3E}.st-approved .ochip{background:#2E8C3E}
.st-declined{border-left-color:#bbb;opacity:.75}.st-declined .ochip{background:#888}
.st-cal{border-left-color:#616161}.st-cal .ochip{background:#616161}
.o-btns{display:flex;gap:8px;flex-basis:100%}.o-btns .btn{flex:1}
.tab{white-space:nowrap;letter-spacing:-.01em}
@media(max-width:560px){.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;overflow:visible}.tab{font-size:13.5px;padding:0 2px;min-height:48px;line-height:1.1;border-radius:13px;white-space:normal}}
/* ---- sticky header so day/week switching is always in reach ---- */
.stick{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:0 16px;box-shadow:0 6px 10px -10px rgba(0,0,0,.25)}
/* ---- Ridgeway brand header ---- */
.wrap{padding-top:0}
.top{background:linear-gradient(160deg,#184A66 0%,#0E2A3B 100%);color:#fff;margin:0 -16px;padding:max(14px,env(safe-area-inset-top)) 16px 14px;border-bottom:4px solid var(--orange)}
.top .eyebrow{color:#8FBBD6}
.top .btn{background:rgba(255,255,255,.12);color:#fff}.top .btn.ghost{border-color:rgba(255,255,255,.35)}
.top .btn.pri{background:var(--orange)}
.brand{gap:16px}
.brand>div:last-child{border-left:2px solid rgba(255,255,255,.18);padding-left:16px}
.top .brand b{font-family:'Lexend Exa',var(--font);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.01em;margin-top:3px;background:linear-gradient(180deg,#F2F6FA 15%,#9FB6D3 95%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:2px}
/* ---- phone ---- */
@media(max-width:560px){
  body{font-size:17px}
  .brand{min-width:0}
  .brand .eyebrow{font-size:11px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand b{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand>div:last-child{min-width:0}
  .top{gap:8px;flex-wrap:nowrap;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px}
  .brand{gap:10px}.brand>div:last-child{padding-left:0;border-left:0}
  .top .brand b{font-size:14px;letter-spacing:-.03em}
  .top .btn{padding:0 12px}
  .logo,.logo img{height:27px}
  .top .btn{min-height:46px;padding:0 14px}
  .tabs{padding:10px 0 4px}
  .tab{flex:1 1 0;min-height:48px;padding:0 4px;font-size:14.5px;letter-spacing:-.02em;border-radius:14px}
  .nav{gap:8px;margin:10px 0 12px}
  .nav h1{order:2;flex:1 1 calc(100% - 128px);min-width:0;text-align:center;font-size:26px}
  .nav h1 small{font-size:15px}
  .nav .round{order:1;width:48px;height:48px}
  .nav .round+h1+.round,.nav h1+.round{order:3}
  .nav .btn{order:4;flex:1 1 40%}
  .editbar{padding:8px 10px}.editbar span{flex-basis:100%}.editbar .btn{flex:1 1 auto}
  .daynote{padding:12px 14px}
  .site{border-radius:18px}
  .shead{padding:14px 14px 8px;gap:10px}
  .shead h2{font-size:24px}
  .num{width:38px;height:38px;font-size:19px;border-radius:11px}
  .crew{padding:0 14px 8px}
  .addr{margin:0 12px 10px;padding:10px 12px}
  .sec{margin:0 12px 10px;padding:9px 12px}
  .sec li{font-size:18px;padding-left:28px}
  .sfoot{padding:4px 12px 14px}.sfoot .btn{flex:1 1 auto}
  .box2{padding:18px;border-radius:20px}
  .modal{padding:10px 8px;align-items:flex-start}
  .dir{grid-template-columns:1fr}
  .toast{white-space:normal;max-width:92vw;text-align:center;bottom:calc(16px + env(safe-area-inset-bottom))}
}
/* ---- tablet ---- */
@media(min-width:561px) and (max-width:1100px){
  .shead h2{font-size:26px}
}
@media(hover:none){.btn,.tab,.round,.wcard,.pick{-webkit-tap-highlight-color:transparent}}
/* safety forms */
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media(max-width:560px){.ftiles{grid-template-columns:1fr 1fr;gap:10px}}
.ftile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:0;border-radius:22px;box-shadow:0 2px 0 var(--line);padding:16px;min-height:150px;border-top:8px solid var(--fc)}
.ftile .ic{width:56px;height:56px;border-radius:16px;background:var(--fc);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.ftile .ic svg{width:40px;height:40px}
.ftile b{font-size:19px;font-weight:700;line-height:1.15}
.ftile small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:2px}
@media(max-width:560px){.ftile{padding:12px;min-height:0;border-radius:18px}.ftile .ic{width:46px;height:46px;font-size:24px;border-radius:13px}.ftile .ic svg{width:32px;height:32px}.ftile b{font-size:16px}.ftile small{font-size:13px}}
#formview{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
#formview .fbar{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:var(--card);box-shadow:0 2px 0 var(--line)}
#formview .fbar b{flex:1;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#formview iframe{flex:1;width:100%;border:0;background:var(--bg)}
.fload{position:absolute;left:0;right:0;top:90px;text-align:center;color:var(--muted);font-weight:600;pointer-events:none}
.updrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 24px;color:var(--muted);font-size:13px;font-weight:500}
.rlist{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:0 2px 0 var(--line);padding:10px 12px;border-left:8px solid var(--tc)}
.rrow .num{flex:none}.rrow .rt{flex:1;min-width:0}.rrow .rt b{display:block;font-size:19px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rt span{display:block;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{flex:none;width:52px;height:52px;border-radius:14px;border:0;background:var(--chip2);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.rbtn:disabled{opacity:.3}
[data-a="noteNext"]{max-width:100%;white-space:normal;text-align:left;line-height:1.2}
@media(max-width:430px){.top .dtx{display:none}.top:has([data-a="lock"]) [data-a="toggleEdit"],.top [data-a="lock"]{width:52px;min-width:0;padding:0;flex:none}.top:has([data-a="lock"]) [data-a="refresh"]{display:none}}
@media(max-width:560px){.top [data-a="toggleEdit"],.top [data-a="lock"]{padding:0 12px;font-size:16px}.top [data-a="lock"]{min-width:0}}
@media(max-width:560px){.tabs .tab:nth-child(6):last-child,.tabs .tab:nth-child(6)~.tab{font-size:12px}.tabs:has(.tab:nth-child(6)) .tab{font-size:12px}}
</style>

function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function pad(n){return(n<10?"0":"")+n;}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function todayKey(){var d=new Date();var w=d.getDay();if(w===6)d.setDate(d.getDate()+2);if(w===0)d.setDate(d.getDate()+1);return key(d);}
function realToday(){return key(new Date());}
function addWorkdays(k,n){var d=parse(k);var step=n<0?-1:1;n=Math.abs(n);while(n>0){d.setDate(d.getDate()+step);var w=d.getDay();if(w!==0&&w!==6)n--;}return key(d);}
function monday(k){var d=parse(k);var w=d.getDay();d.setDate(d.getDate()-((w+6)%7));return key(d);}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d);}
var DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function longDate(k){var d=parse(k);return DN[d.getDay()]+", "+MN[d.getMonth()]+" "+d.getDate();}
function shortDate(k){var d=parse(k);return MN[d.getMonth()]+" "+d.getDate();}
function typeOf(k){for(var i=0;i<TYPES.length;i++)if(TYPES[i].k===k)return TYPES[i];return TYPES[TYPES.length-1];}
function job(id){for(var i=0;i<state.jobs.length;i++)if(state.jobs[i].id===id)return state.jobs[i];return null;}
/* Which jobsite a calendar event belongs to. This lives in the app (not the Google backend) so it can be changed from a phone:
   1) the jobsite name or one of its calendar nicknames appears as whole words in the event title (longest wins),
   2) otherwise the builder name appears and only one jobsite has that builder,
   3) otherwise whatever the backend matched, or a jobsite picked by hand. */
function wordIn(t,w){return new RegExp("(^|[^a-z0-9])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z0-9]|$)").test(t);}
function matchJob(title){
  var t=String(title||"").toLowerCase(),best=null,bn=0;if(!t)return null;
  (state.jobs||[]).forEach(function(j){[j.name].concat(String(j.aka||"").split(",")).forEach(function(x){var n=String(x||"").trim().toLowerCase();if(n&&n.length>bn&&wordIn(t,n)){best=j;bn=n.length;}});});
  if(best)return best;
  var hits=(state.jobs||[]).filter(function(j){var b=String(j.builder||"").toLowerCase();return b&&wordIn(t,b);});
  return hits.length===1?hits[0]:null;
}
function itemJob(it){return (it.jobManual&&job(it.jobManual))||(it.calId&&it.calTitle?matchJob(it.calTitle):null)||job(it.jobId);}
function crewName(id){for(var i=0;i<state.crew.length;i++)if(state.crew[i].id===id)return state.crew[i].name;return "?";}
function day(k){return state.days[k]||{note:"",items:[]};}
function lines(s){return String(s||"").split(/\n/).map(function(x){return x.replace(/^\s*[-•*]\s*/,"").trim();}).filter(Boolean);}
function phoneLinks(t){return esc(t).replace(/(\+?1[\s.-]?)?\(?(\d{3})\)?[\s.-]?(\d{3})[\s.-]?(\d{4})/g,function(m0,p,a,b,c){return '<a class="tel" href="tel:+1'+a+b+c+'">'+m0+'</a>';});}
function mapUrl(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);}
function editing(){return editMode&&!!pin;}

/* ---------- server (Google Apps Script) ---------- */
function apiReady(){return API_URL&&API_URL.indexOf("__")!==0;}
function load(quiet){
  if(!apiReady()){loadErr="setup";render();return;}
  if(loading)return;loading=true;if(!quiet)render();
  fetch(API_URL+"?action=board&t="+Date.now()).then(function(r){return r.json();}).then(function(res){
    loading=false;
    if(!res||!res.ok)throw new Error(res&&res.error||"error");
    if(typingNote()&&loaded)return;
    if(!modalEl.hidden&&loaded){render();return;}
    state=res.state;loaded=true;loadErr="";if(editing())loadOffList();
    try{localStorage.setItem("cjb-cache",JSON.stringify(state));}catch(e){}
    render();
  }).catch(function(e){loading=false;loadErr=navigator.onLine===false?"offline":"error";render();});
}
function post(body){
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json();});
}
var saving=false;
function save(msg){
  state.updatedAt=Date.now();render();
  try{localStorage.setItem("cjb-cache",JSON.stringify(state));}catch(e){}
  if(!apiReady()){toast("Not connected yet");return;}
  saving=true;toast("Saving…");
  post({action:"save",pin:pin,state:state}).then(function(res){
    saving=false;
    if(res&&res.ok){state.updatedAt=res.updatedAt;toast(msg||"Saved — the crew can see it");render();}
    else if(res&&res.error==="wrong pin"){pin="";try{localStorage.removeItem("cjb-pin");}catch(e){}editMode=false;render();toast("PIN changed — enter it again");}
    else toast("Couldn't save — try again");
  }).catch(function(){saving=false;toast("Couldn't save — check your signal and try again");});
}
function askPin(){
  openModal('<h2>Manager PIN</h2><div><label>Enter your PIN to edit the board</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off"></div><div class="mrow"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="checkPin">Unlock</button></div>');
  setTimeout(function(){var el=document.getElementById("pin-in");if(el)el.focus();},50);
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&modalEl.hidden&&!saving&&!typingNote())load(true);});
setInterval(function(){if(document.visibilityState==="visible"&&modalEl.hidden&&!saving&&!editing())load(true);},5*60*1000);
var APP_VERSION="2026.11.19-3";
/* Check for updates: get the newest app from GitHub; reload if it changed, otherwise refresh the schedule */
function checkUpdates(btn){
  if(btn){btn.disabled=true;btn.textContent="Checking…";}
  var done=function(msg){if(btn){btn.disabled=false;btn.textContent="Check for updates";}if(msg)toast(msg);};
  if(navigator.onLine===false){done("No signal");return;}
  var swu=("serviceWorker" in navigator)?navigator.serviceWorker.getRegistration().then(function(r){return r&&r.update();}).catch(function(){}):Promise.resolve();
  swu.then(function(){return fetch("index.html?u="+Date.now(),{cache:"no-store"});}).then(function(r){return r.text();}).then(function(t){
    var m=t.match(/var APP_VERSION="([^"]+)"/),v=m?m[1]:APP_VERSION;
    if(v!==APP_VERSION){toast("Updating…");setTimeout(function(){location.reload();},700);return;}
    load();done("Up to date ✓");
  }).catch(function(){done("Couldn't check, try again");});
}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
var tt=null;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;t.classList.remove("out");clearTimeout(tt);tt=setTimeout(function(){t.classList.add("out");},m.length>40?4500:1800);}

/* ---------- routing ---------- */
function readHash(){
  var h=(location.hash||"").replace("#","");var m;
  if((m=h.match(/^day-(\d{4}-\d\d-\d\d)$/))){view="day";cur=m[1];}
  else if((m=h.match(/^week-(\d{4}-\d\d-\d\d)$/))){view="week";cur=m[1];}
  else if(h==="jobs")view="jobs";else if(h==="crew")view="crew";else if(h==="off")view="off";else if(h==="forms")view="forms";
}
function go(v,k){view=v;if(k)cur=k;var h=v==="day"?"day-"+cur:v==="week"?"week-"+monday(cur):v;try{history.replaceState(null,"","#"+h);}catch(e){location.hash=h;}render();window.scrollTo(0,0);}
window.addEventListener("hashchange",function(){readHash();render();});

/* ---------- render ---------- */
function render(){
  var h='<div class="stick"><div class="top"><div class="brand"><div class="logo" id="logo">'+LOGO+'</div><div><div class="eyebrow">Ridgeway Aluminum · Railings</div><b>Crew Job Board</b></div></div>';
  h+='<button class="btn ghost" data-a="refresh" aria-label="Refresh">'+(loading?'…':'↻')+'</button>';
  if(pin){h+='<button class="btn '+(editing()?'org':'ghost')+'" data-a="toggleEdit">'+(editing()?'✓<span class="dtx"> Done</span>':'✎ Edit')+'</button>';if(editing())h+='<button class="btn ghost" data-a="lock" aria-label="Lock">🔒</button>';}
  h+='</div>';
  h+='<div class="tabs">'+tab("day","Day")+tab("week","Week")+tab("jobs","Jobsites")+tab("off","Time Off"+(editing()&&offCount()?' <span class="badge">'+offCount()+'</span>':''))+tab("forms","Safety")+(editing()?tab("crew","Crew"):"")+'</div></div>';
  if(loadErr==="setup")h+='<div class="editbar"><span>Not connected to the calendar yet — paste the Apps Script web app URL into API_URL.</span></div>';
  else if(loadErr==="offline")h+='<div class="editbar"><span>No signal — showing the last copy saved on this phone.</span></div>';
  else if(loadErr)h+='<div class="editbar"><span>Couldn\'t reach the board — showing the last copy. Tap ↻ to try again.</span></div>';
  if(!loaded&&loading&&!state.jobs.length)h+='<div class="empty">Loading the schedule…</div>';
  if(view==="day")h+=renderDay();else if(view==="week")h+=renderWeek();else if(view==="jobs")h+=renderJobs();else if(view==="off")h+=renderOff();else if(view==="forms")h+=renderForms();else h+=renderCrew();
  h+='<div class="legend">'+TYPES.map(function(t){return '<span><i style="background:'+t.c+'"></i>'+t.n+'</span>';}).join("")+'</div>';
  if(state.updatedAt)h+='<div class="ro">Last updated '+new Date(state.updatedAt).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+'</div>';
  h+='<div class="updrow" id="pushRow"></div>';
  h+='<div class="updrow"><button class="btn sm" data-a="checkUpd">Check for updates</button><span>App version '+APP_VERSION+'</span></div>';
  root.innerHTML=h;
  setTimeout(pushUI,0);
}
function tab(v,n){return '<button class="tab'+(view===v?' on':'')+'" data-a="go" data-v="'+v+'">'+n+'</button>';}

function renderDay(){
  var d=day(cur),h='';
  h+='<div class="nav"><button class="round" data-a="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h1>'+(cur===realToday()?'Today':longDate(cur).split(",")[0])+'<small>'+longDate(cur)+' · '+d.items.length+' job'+(d.items.length===1?'':'s')+'</small></h1><button class="round" data-a="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>';
  if(cur!==todayKey())h+='<button class="btn sm" data-a="toToday">Today</button>';
  if(editing())h+='<button class="btn sm" data-a="notify">📣 Notify crew</button>';
  if(editing()&&d.items.length>1)h+='<button class="btn sm'+(reorder?' pri':'')+'" data-a="reorder">'+(reorder?'✓ Done reordering':'⇅ Reorder')+'</button>';
  if(d.items.length>1&&!reorder)h+='<button class="btn sm" data-a="foldAll">'+(foldAllState()?'Expand all':'Collapse all')+'</button>';
  h+=(editing()?'<button class="btn sm" data-a="copyDay">Copy as text</button>':'')+'</div>';
  if(editing()){
    h+='<div class="editbar"><span>Editing '+longDate(cur)+'</span><button class="btn sm pri" data-a="addItem">+ Add job</button><button class="btn sm" data-a="editDayNote">'+(d.note?'Edit':'Add')+' day note</button>'+(d.items.length?'<button class="btn sm" data-a="copyDayTo">Copy whole day to…</button>':'')+'</div>';
  }
  if(editing()&&state.calError)h+='<div class="calbar"><span style="color:var(--bad)">Calendar not read: '+esc(state.calError)+'</span></div>';
  h+=awayBanner(cur);
  if(d.note)h+='<div class="daynote">'+esc(d.note)+'</div>';
  if(!d.items.length){h+='<div class="empty">Nothing scheduled for '+longDate(cur)+' yet.'+(editing()?' Tap “+ Add job”.':'')+'</div>';return h;}
  if(reorder&&editing()&&d.items.length>1){
    h+='<div class="rlist">';
    d.items.forEach(function(it,i){var j=itemJob(it)||{name:it.jobName||"Site"},t=typeOf(it.type);
      h+='<div class="rrow" style="--tc:'+t.c+'"><div class="num">'+(i+1)+'</div><div class="rt"><b>'+esc(j.name)+'</b><span>'+t.n+(j.builder?' · '+esc(j.builder):'')+(it.calTitle&&it.calTitle.toLowerCase()!==String(j.name).toLowerCase()?' · '+esc(it.calTitle):'')+'</span></div>'+
        '<button class="rbtn" data-a="up" data-i="'+i+'" aria-label="Move up"'+(i===0?' disabled':'')+'><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button class="rbtn" data-a="down" data-i="'+i+'" aria-label="Move down"'+(i===d.items.length-1?' disabled':'')+'><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>';});
    return h+'</div>';
  }
  h+='<div class="sites">';
  d.items.forEach(function(it,i){h+=siteCard(it,i,d.items.length);});
  return h+'</div>';
}
var reorder=false;
var FOLD={};try{FOLD=JSON.parse(localStorage.getItem("cjb-fold")||"{}")||{};}catch(e){FOLD={};}
function foldKey(it,i){return cur+"|"+(it.calId||it.id||((it.jobId||it.jobName||"")+"#"+i));}
function foldSave(){try{var cut=addDays(todayKey(),-14),k;for(k in FOLD)if(k.slice(0,10)<cut)delete FOLD[k];localStorage.setItem("cjb-fold",JSON.stringify(FOLD));}catch(e){}}
function foldSet(i,v){var d=day(cur),it=d.items[i];if(!it)return;var k=foldKey(it,i);if(v)FOLD[k]=1;else delete FOLD[k];foldSave();var el=document.querySelectorAll(".sites .site")[i];if(el)el.classList.toggle("folded",!!v);foldBtn();}
function foldAllState(){var d=day(cur);return d.items.length&&d.items.every(function(it,i){return FOLD[foldKey(it,i)];});}
function wFoldAllState(){var m=monday(cur);for(var i=0;i<5;i++)if(!FOLD[addDays(m,i)+"|W"])return false;return true;}
function wFoldSet(k,v){if(v)FOLD[k+"|W"]=1;else delete FOLD[k+"|W"];foldSave();var b=document.querySelector('.wfold[data-k="'+k+'"]');if(b){b.closest(".wday").classList.toggle("wfolded",!!v);b.setAttribute("aria-expanded",String(!v));}var a=document.querySelector('[data-a="wfoldAll"]');if(a)a.textContent=wFoldAllState()?"Expand all":"Collapse all";}
function foldBtn(){var b=document.querySelector('[data-a="foldAll"]');if(b)b.textContent=foldAllState()?"Expand all":"Collapse all";}
function sec(cls,title,arr){if(!arr.length)return "";return '<div class="sec '+cls+'"><h3>'+title+'</h3><ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>';}
function siteCard(it,i,n){
  var j=itemJob(it)||{name:it.jobName||"Site",address:""},t=typeOf(it.type);
  var folded=!!FOLD[foldKey(it,i)];
  var fs=[];if(it.crew&&it.crew.length)fs.push(it.crew.map(crewName).join(", "));if(j.address)fs.push(j.address.split(",")[0]);
  var h='<div class="site'+(folded?' folded':'')+'" style="--tc:'+t.c+'"><div class="shead" data-a="fold" data-i="'+i+'"><div class="num">'+(i+1)+'</div><div class="t"><h2>'+esc(j.name)+(j.builder?' <span class="bld">'+esc(j.builder)+'</span>':'')+'</h2><div class="meta"><span class="type">'+t.n+'</span>'+(it.start?'Start '+esc(it.start):'')+(it.area?' · '+esc(it.area):'')+'</div>'+(it.calTitle&&it.calTitle.toLowerCase()!==String(j.name).toLowerCase()?'<div class="caltitle">📅 '+esc(it.calTitle)+'</div>':'')+(fs.length?'<div class="fsum">'+esc(fs.join(" · "))+'</div>':'')+'</div><button class="fold" aria-label="Collapse or expand this site" aria-expanded="'+(!folded)+'"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>';
  if(it.crew&&it.crew.length){h+='<div class="crew">'+it.crew.map(function(c){return '<span class="cchip'+(c===it.lead?' lead':'')+'">'+(c===it.lead?'★ ':'')+esc(crewName(c))+'</span>';}).join("")+'</div>';}
  if(j.address||j.contact){
    h+='<div class="addr"><div class="a">'+(j.address?esc(j.address):'<span style="color:var(--muted)">No address saved</span>')+(j.contact?'<small>Site contact: '+phoneLinks(j.contact)+'</small>':'')+(j.access?'<small>'+esc(j.access)+'</small>':'')+'</div>'+(j.address?'<a class="map" href="'+mapUrl(j.address)+'" target="_blank" rel="noopener">Map ↗</a>':'')+'</div>';
  }
  h+=sec("s-lo","Leave off — site access",lines(it.leaveOff));
  h+=sec("s-do","To do today",lines(it.tasks));
  h+=sec("s-ms","Measure",lines(it.measure));
  h+=sec("s-br","Bring / load",lines(it.bring));
  if(editing())h+='<div class="sec s-nt s-nted"><h3>Notes &amp; instructions for the crew</h3><textarea class="inote" data-inote="'+i+'" placeholder="Type instructions, details, who to see on site…">'+esc(it.notes||"")+'</textarea><div class="noterow"><div class="inote-st" data-inst="'+i+'"></div><button class="btn sm ghost" data-a="noteNext" data-i="'+i+'">Copy note to next '+esc(j.name)+' day →</button></div></div>';
  else if(it.notes&&it.notes.trim())h+='<div class="sec s-nt"><h3>Notes &amp; instructions</h3>'+esc(it.notes)+'</div>';
  if(editing()){
    h+='<div class="sfoot"><button class="btn sm pri" data-a="editItem" data-i="'+i+'">Edit</button><button class="btn sm" data-a="repeatItem" data-i="'+i+'">Repeat next day</button>'+(i>0?'<button class="btn sm" data-a="up" data-i="'+i+'">↑</button>':'')+(i<n-1?'<button class="btn sm" data-a="down" data-i="'+i+'">↓</button>':'')+'<button class="btn sm danger" data-a="delItem" data-i="'+i+'">Remove</button></div>';
  }
  return h+'</div>';
}

function renderWeek(){
  var m=monday(cur),wk=state.weeks[m]||"",h='';
  h+='<div class="nav"><button class="round" data-a="prevWeek" aria-label="Previous week"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h1>Week of '+shortDate(m)+'<small>'+shortDate(m)+' – '+shortDate(addDays(m,4))+'</small></h1><button class="round" data-a="nextWeek" aria-label="Next week"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>';
  if(monday(todayKey())!==m)h+='<button class="btn sm" data-a="toThisWeek">This week</button>';
  h+='<button class="btn sm" data-a="wfoldAll">'+(wFoldAllState()?'Expand all':'Collapse all')+'</button>';
  h+=(editing()?'<button class="btn sm" data-a="copyWeek">Copy as text</button>':'')+'</div>';
  if(editing())h+='<div class="editbar"><span>Editing week of '+shortDate(m)+'</span><button class="btn sm" data-a="editWeekNote">'+(wk?'Edit':'Add')+' week note</button><button class="btn sm" data-a="copyWeekNext">Copy this week to next week</button></div>';
  if(wk)h+='<div class="daynote weeknote">'+esc(wk)+'</div>';
  h+='<div class="week">';
  for(var i=0;i<5;i++){
    var k=addDays(m,i),d=day(k);
    var wf=!!FOLD[k+"|W"],nsites=d.items.length;
    h+='<div class="wday'+(k===realToday()?' today':'')+(wf?' wfolded':'')+'"><div class="wh"><button class="whead" data-a="openDay" data-k="'+k+'">'+DN[parse(k).getDay()].slice(0,3)+' <small>'+shortDate(k)+'</small></button><button class="wfold" data-a="wfold" data-k="'+k+'" aria-label="Collapse or expand '+DN[parse(k).getDay()]+'" aria-expanded="'+(!wf)+'"><span class="wcount">'+(nsites?nsites+' job'+(nsites===1?'':'s'):'')+'</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>'+(awayOn(k).length?'<div class="wempty wav">🏖 '+awayOn(k).map(esc).join(", ")+'</div>':'');
    if(d.note)h+='<div class="wempty" style="color:var(--deep)">'+esc(d.note.split("\n")[0])+'</div>';
    if(!d.items.length)h+='<div class="wempty">—</div>';
    d.items.forEach(function(it){
      var j=itemJob(it)||{name:it.jobName||"Site"},t=typeOf(it.type),lo=lines(it.leaveOff).length,ms=lines(it.measure).length;
      h+='<button class="wcard" style="--tc:'+t.c+'" data-a="openDay" data-k="'+k+'"><b>'+esc(j.name)+'</b>'+(it.calTitle&&it.calTitle.toLowerCase()!==String(j.name).toLowerCase()?'<span style="color:var(--ink)">'+esc(it.calTitle)+'</span>':'')+(j.builder?'<span>'+esc(j.builder)+'</span>':'')+'<span>'+t.n+(it.start?' · '+esc(it.start):'')+'</span>'+(it.crew&&it.crew.length?'<span>'+it.crew.map(crewName).map(esc).join(", ")+'</span>':'')+(lo?'<span class="lo">⛔ '+lo+' left off</span>':'')+(ms?'<span style="color:#B3261E">📏 '+ms+' to measure</span>':'')+'</button>';
    });
    if(editing())h+='<button class="btn sm ghost" data-a="addItemOn" data-k="'+k+'">+ Add</button>';
    h+='</div>';
  }
  return h+'</div>';
}

function renderJobs(){
  var h='<div class="nav"><h1>Jobsites<small>'+state.jobs.length+' sites · addresses, contacts and access info</small></h1>'+(editing()?'<button class="btn pri" data-a="addJob">+ Add jobsite</button>':'')+'</div>';
  h+='<input class="search" id="jq" placeholder="Search jobsites…" value="'+esc(q)+'">';
  var ql=q.trim().toLowerCase();
  var list=state.jobs.filter(function(j){return !ql||(j.name+" "+(j.builder||"")+" "+(j.address||"")+" "+(j.notes||"")).toLowerCase().indexOf(ql)>-1;}).sort(function(a,b){return a.name.localeCompare(b.name);});
  h+='<div class="dir">';
  list.forEach(function(j){
    h+='<div class="dcard"><b>'+esc(j.name)+'</b>'+(j.builder?' <span class="bld">'+esc(j.builder)+'</span>':'')+(j.address?'<p>📍 <a href="'+mapUrl(j.address)+'" target="_blank" rel="noopener">'+esc(j.address)+'</a></p>':'<p class="miss">No address yet</p>')+(j.contact?'<p>👷 '+phoneLinks(j.contact)+'</p>':'')+(editing()&&railLine(j)?'<p>🛠 '+esc(railLine(j))+'</p>':'')+(j.access?'<p>🔑 '+esc(j.access)+'</p>':'')+(j.notes?'<p>'+esc(j.notes)+'</p>':'');
    if(editing())h+='<div style="margin-top:8px"><button class="btn sm pri" data-a="editJob" data-id="'+j.id+'">Edit</button></div>';
    h+='</div>';
  });
  return h+'</div>';
}
function renderCrew(){

/* ---------- text export ---------- */
function dayText(k){
  var d=day(k),out=[longDate(k).toUpperCase()];
  if(d.note)out.push(d.note);
  if(!d.items.length)out.push("Nothing scheduled.");
  d.items.forEach(function(it,i){
    var j=itemJob(it)||{name:it.jobName||"Site"},t=typeOf(it.type);
    out.push("");out.push((i+1)+". "+j.name+(j.builder?" ("+j.builder+")":"")+" — "+t.n+(it.start?" ("+it.start+")":""));
    if(it.crew&&it.crew.length)out.push("Crew: "+it.crew.map(function(c){return crewName(c)+(c===it.lead?" (lead)":"");}).join(", "));
    if(j.address)out.push("Address: "+j.address+"\n"+mapUrl(j.address));
    if(j.contact)out.push("Contact: "+j.contact);
    if(it.calTitle&&it.calTitle.toLowerCase()!==String(j.name).toLowerCase())out.push(it.calTitle);
    if(it.area)out.push("Area: "+it.area);
    [["LEAVE OFF",it.leaveOff],["To do",it.tasks],["Measure",it.measure],["Bring",it.bring]].forEach(function(p){var l=lines(p[1]);if(l.length){out.push(p[0]+":");l.forEach(function(x){out.push(" - "+x);});}});
    if(it.notes&&it.notes.trim())out.push("Notes: "+it.notes.trim());
  });
  return out.join("\n");
}
function copy(text){
  var done=function(){toast("Copied — paste into a text or email");};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){showText(text);});}else showText(text);
}
function showText(text){openModal('<h2>Copy this</h2><textarea style="min-height:360px" readonly>'+esc(text)+'</textarea><div class="mrow"><button class="btn pri" data-a="close">Done</button></div>');}

/* ---------- time off ---------- */
function awayOn(k){
  var out=[];
  (state.timeOff||[]).forEach(function(t){if(t.status==="approved"&&t.from<=k&&t.to>=k)out.push(t.name);});
  (state.calAway||[]).forEach(function(a){if(a.from<=k&&a.to>=k)out.push(a.title.replace(/^away\s*[-:–]\s*/i,""));});
  return out;
}
function awayBanner(k){var a=awayOn(k);return a.length?'<div class="awaybar">🏖 Away: '+a.map(esc).join(", ")+'</div>':'';}
function rangeText(f,t){
  var n=0,k=f;while(k<=t){var w=parse(k).getDay();if(w!==0&&w!==6)n++;k=addDays(k,1);}
  var a=DN[parse(f).getDay()].slice(0,3)+" "+shortDate(f);
  return (f===t?a:a+" – "+DN[parse(t).getDay()].slice(0,3)+" "+shortDate(t))+" · "+n+" work day"+(n===1?"":"s");
}

function offSend(btn){
  readOffForm();

  if(!offForm.from){toast("Pick your first day off");return;}
  if(!offForm.to||offForm.to<offForm.from)offForm.to=offForm.from;
  if(!apiReady()){toast("Not connected yet");return;}
  btn.textContent="Sending…";btn.disabled=true;
  post({action:"requestOff",request:{name:name,from:offForm.from,to:offForm.to,note:offForm.note.trim()}}).then(function(r){
    if(r&&r.ok){offForm={name:"",other:"",from:"",to:"",note:""};offSent=true;offFull=null;render();toast("Sent");}
    else{btn.textContent="Send";btn.disabled=false;toast((r&&r.error)||"Couldn't send — try again");}
  }).catch(function(){btn.textContent="Send";btn.disabled=false;toast("Couldn't send — check your signal");});

function offSet(id,s,btn){
  if(s==="delete"&&!btn.getAttribute("data-armed")){btn.setAttribute("data-armed","1");btn.textContent="Tap again";return;}
  btn.textContent="…";
  post({action:"offStatus",pin:pin,id:id,status:s}).then(function(r){
    if(r&&r.ok){offFull=r.timeOff;state.timeOff=r.timeOff.filter(function(t){return t.status==="approved";});render();toast(r.calNote?("Saved, but the calendar said: "+r.calNote):({approved:"Approved — added to your calendar",declined:"Declined",delete:"Deleted"}[s]));}
    else if(r&&r.error==="wrong pin"){toast("PIN changed — unlock again");}
    else toast("Couldn't save — try again");
  }).catch(function(){toast("Couldn't save — check your signal");render();});
}

  b64:function(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);},
  cat:function(){var n=0,i,a=arguments;for(i=0;i<a.length;i++)n+=a[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length;}return o;},
  utf8:function(s){return new TextEncoder().encode(s);},
  hmac:function(key,data){return crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["sign"]).then(function(k){return crypto.subtle.sign("HMAC",k,data);}).then(function(b){return new Uint8Array(b);});},
  newVapid:function(){return crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]).then(function(kp){return Promise.all([crypto.subtle.exportKey("raw",kp.publicKey),crypto.subtle.exportKey("jwk",kp.privateKey)]);}).then(function(r){return{publicKey:WP.b64u(r[0]),privateJwk:r[1]};});},
  jwt:function(privateJwk,aud,subject){
    var enc=function(o){return WP.b64u(WP.utf8(JSON.stringify(o)));};
    var unsigned=enc({typ:"JWT",alg:"ES256"})+"."+enc({aud:aud,exp:Math.floor(Date.now()/1000)+12*3600,sub:subject});
    return crypto.subtle.importKey("jwk",privateJwk,{name:"ECDSA",namedCurve:"P-256"},false,["sign"]).then(function(k){return crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},k,WP.utf8(unsigned));}).then(function(sig){return unsigned+"."+WP.b64u(sig);});
  },
  encrypt:function(sub,payload){
    var uaPub=WP.unb64u(sub.keys.p256dh),auth=WP.unb64u(sub.keys.auth),salt=crypto.getRandomValues(new Uint8Array(16)),asPub,ecdh;

      return crypto.subtle.exportKey("raw",kp.publicKey).then(function(raw){asPub=new Uint8Array(raw);
        return crypto.subtle.importKey("raw",uaPub,{name:"ECDH",namedCurve:"P-256"},false,[]);}).then(function(uk){return crypto.subtle.deriveBits({name:"ECDH",public:uk},kp.privateKey,256);});
    }).then(function(bits){ecdh=new Uint8Array(bits);return WP.hmac(auth,ecdh);})
    .then(function(prkKey){return WP.hmac(prkKey,WP.cat(WP.utf8("WebPush: info\0"),uaPub,asPub,new Uint8Array([1])));})
    .then(function(ikm){return WP.hmac(salt,ikm);})
    .then(function(prk){return Promise.all([WP.hmac(prk,WP.cat(WP.utf8("Content-Encoding: aes128gcm\0"),new Uint8Array([1]))),WP.hmac(prk,WP.cat(WP.utf8("Content-Encoding: nonce\0"),new Uint8Array([1])))]);})
    .then(function(r){var cek=r[0].slice(0,16),nonce=r[1].slice(0,12);
      return crypto.subtle.importKey("raw",cek,{name:"AES-GCM"},false,["encrypt"]).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:nonce},k,WP.cat(WP.utf8(payload),new Uint8Array([2])));});})
    .then(function(ct){var rs=new Uint8Array([0,0,16,0]);return WP.cat(salt,rs,new Uint8Array([65]),asPub,new Uint8Array(ct));});
  },
  message:function(sub,vapid,payload){
    var aud=new URL(sub.endpoint).origin;
    return Promise.all([WP.jwt(vapid.privateJwk,aud,"mailto:matt@ridgewayaluminum.com"),WP.encrypt(sub,payload)]).then(function(r){
      return{endpoint:sub.endpoint,body:WP.b64(r[1]),headers:{"Authorization":"vapid t="+r[0]+", k="+vapid.publicKey,"Content-Encoding":"aes128gcm","TTL":"86400","Urgency":"high"}};});
  }
};

function pushCapable(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;}
function isStandalone(){return !!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));}
/* footer row: turn notifications on (crew), or say they're on */
function pushUI(){
  var el=document.getElementById("pushRow");if(!el)return;
  if(!pushCapable()){el.innerHTML=/iPhone|iPad/.test(navigator.userAgent)&&!isStandalone()?'<span>Add Crew Board to your Home Screen to get notifications</span>':'';return;}
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription();}).then(function(sub){
    el.innerHTML=sub&&Notification.permission==="granted"?'<span>🔔 Notifications are on</span>':(Notification.permission==="denied"?'<span>Notifications are blocked in Settings › Notifications › Crew Board</span>':'<button class="btn sm pri" data-a="pushOn">🔔 Turn on notifications</button>');
  }).catch(function(){el.innerHTML="";});
}
function pushOn(btn){
  if(btn){btn.disabled=true;btn.textContent="Turning on…";}
  var key;
  fetch(API_URL+"?action=vapid").then(function(r){return r.json();}).then(function(r){key=r&&r.key;if(!key)throw new Error("Notifications aren't set up yet. Ask Matt.");
    return Notification.requestPermission();}).then(function(p){if(p!=="granted")throw new Error("Notifications weren't allowed");
    return navigator.serviceWorker.ready;}).then(function(reg){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:WP.unb64u(key)});})
  .then(function(sub){var me="";try{me=localStorage.getItem("cjb-me")||"";}catch(e){}
    if(!me){me=(window.prompt("Your name? (so Matt knows whose phone this is)")||"").trim();try{localStorage.setItem("cjb-me",me);}catch(e){}}
    return post({action:"subscribe",sub:sub.toJSON(),name:me});})
  .then(function(r){if(!r||!r.ok)throw new Error((r&&r.error)||"Couldn't turn on");toast("🔔 Notifications on");pushUI();})
  .catch(function(e){toast(String(e&&e.message||e));pushUI();});
}
/* manager: send a notification to every phone that turned them on */
var pushInfoCache=null;
function notifyForm(){
  openModal('<h2>📣 Notify the crew</h2><p id="nfCount" style="margin:0;color:var(--muted);font-weight:500">Checking phones…</p><label>Message</label><textarea id="nfMsg" rows="4" maxlength="240" placeholder="e.g. Grab your jackets from the merc before you head out"></textarea><div class="mrow"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="notifySend">Send</button></div>');
  post({action:"pushInfo",pin:pin}).then(function(r){pushInfoCache=r;var c=document.getElementById("nfCount");if(!c)return;
    if(!r||!r.ok){c.textContent="Couldn't reach the board: "+((r&&r.error)||"");return;}
    var n=r.subs.length,names=r.subs.map(function(x){return x.name;}).filter(Boolean);
    c.textContent=n?("Goes to "+n+" phone"+(n===1?"":"s")+(names.length?": "+names.join(", "):"")):"No phones have turned on notifications yet. The crew tap 🔔 Turn on notifications at the bottom of the board.";
  }).catch(function(){var c=document.getElementById("nfCount");if(c)c.textContent="Couldn't reach the board.";});
  setTimeout(function(){var t=document.getElementById("nfMsg");if(t)t.focus();},150);
}
function ensureVapid(info){
  if(info.vapidPublic&&info.vapidPrivate&&info.vapidPrivate!=="{}")return Promise.resolve({publicKey:info.vapidPublic,privateJwk:JSON.parse(info.vapidPrivate)});
  return WP.newVapid().then(function(v){return post({action:"setVapid",pin:pin,publicKey:v.publicKey,privateJwk:v.privateJwk}).then(function(r){if(!r||!r.ok)throw new Error((r&&r.error)||"key setup failed");return v;});});
}
function notifySend(btn){
  var msg=(document.getElementById("nfMsg").value||"").trim();if(!msg){toast("Type a message");return;}
  btn.disabled=true;btn.textContent="Sending…";
  var info;
  (pushInfoCache&&pushInfoCache.ok?Promise.resolve(pushInfoCache):post({action:"pushInfo",pin:pin})).then(function(r){info=r;if(!r||!r.ok)throw new Error((r&&r.error)||"Couldn't reach the board");
    if(!r.subs.length)throw new Error("No phones have notifications on yet");return ensureVapid(r);})
  .then(function(v){var payload=JSON.stringify({title:"Crew Board",body:msg,url:"./"});return Promise.all(info.subs.map(function(sub){return WP.message(sub,v,payload);}));})
  .then(function(msgs){return post({action:"pushSend",pin:pin,msgs:msgs});})
  .then(function(r){if(!r||!r.ok)throw new Error((r&&r.error)||"Send failed");closeModal();pushInfoCache=null;
    toast("📣 Sent to "+r.sent+" phone"+(r.sent===1?"":"s")+(r.removed?" ("+r.removed+" old phone"+(r.removed===1?"":"s")+" removed)":""));})
  .catch(function(e){btn.disabled=false;btn.textContent="Send";toast(String(e&&e.message||e));});
}

/* manager unlock: tap the logo 5 times quickly, or hold it 2 seconds (same as Shop Cuts) */
